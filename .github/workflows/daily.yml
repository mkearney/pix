name: daily pix

# Once a day, Claude picks a fresh topic, does the analysis, renders the
# graphic, archives it, and republishes README.md. See CLAUDE.md for the brief.
on:
  schedule:
    - cron: "17 11 * * *"   # 11:17 UTC daily
  workflow_dispatch:
    inputs:
      topic_hint:
        description: "Optional nudge for today's topic (leave blank to let Claude choose)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-pix
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts and Python deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter
          pip install -r requirements.txt

      - name: Make today's pix
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Produce today's pix entry by following CLAUDE.md exactly
            ("Daily procedure"). Today's UTC date is the folder date.
            Topic hint from the maintainer (may be empty): "${{ github.event.inputs.topic_hint }}"
            Do not commit or push; the workflow does that after you finish.
          claude_args: >-
            --max-turns 150
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"

      - name: Verify and publish
        run: |
          python scripts/publish.py
          test -n "$(ls -d archive/$(date -u +%F)-*/ 2>/dev/null)" || { echo "no entry for today"; exit 1; }

      - name: Commit and push
        run: |
          git config user.name "pix-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          title=$(sed -n 's/^title: //p' archive/$(date -u +%F)-*/post.md | head -1)
          git commit -m "pix $(date -u +%F): ${title}"
          git push
